name: Django PostgreSQL tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloud_integration
          POSTGRES_USER: cloud_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_test -d cloud_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: disposable-integration-test-key
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: cloud_integration
      POSTGRES_USER: cloud_test
      POSTGRES_PASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django test dependencies
        run: python -m pip install -r requirements-django.txt
      - name: Check Django and migration consistency
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - name: Apply migrations to disposable service database
        run: python backend/manage.py migrate --noinput
      - name: Run database integration tests
        run: python backend/manage.py test tasks --noinput --verbosity 2
